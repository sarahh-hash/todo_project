<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Мои задачи</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 16px;
            background: #f3f4f6;
            color: #333;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 800px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .add-button {
            display: inline-block;
            margin-bottom: 24px;
            padding: 12px 18px;
            background: #6955d9;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .add-button:hover {
            background: #5542bc;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 12px;
            padding: 18px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            color: #333;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        .task-title:hover {
            color: #6955d9;
        }

        .done .task-title {
            color: #888;
            text-decoration: line-through;
        }

        .status {
            margin: 8px 0 0;
            color: #777;
            font-size: 14px;
        }

        .done .status {
            color: #29945b;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            background: #eae6ff;
            color: #5542bc;
            font-size: 14px;
            cursor: pointer;
        }

        button:hover {
            background: #dcd5ff;
        }

        .empty {
            padding: 25px 0;
            color: #777;
            text-align: center;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid #a493f0;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .task {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Мои задачи</h1>

    <a class="add-button" href="{% url 'tasks:create' %}">
        + Добавить задачу
    </a>

    {% for task in tasks %}
        <div class="task {% if task.is_completed %}done{% endif %}">
            <div class="task-info">
                <a
                    class="task-title"
                    href="{% url 'tasks:detail' task.pk %}"
                >
                    {{ task.title }}
                </a>

                <p class="status">
                    {% if task.is_completed %}
                        ✓ Выполнено
                    {% else %}
                        Не выполнено
                    {% endif %}
                </p>
            </div>

            <form
                method="post"
                action="{% url 'tasks:toggle' task.pk %}"
            >
                {% csrf_token %}

                <button type="submit">
                    {% if task.is_completed %}
                        Вернуть в работу
                    {% else %}
                        Выполнить
                    {% endif %}
                </button>
            </form>
        </div>
    {% empty %}
        <p class="empty">
            Пока задач нет. Добавь первую!
        </p>
    {% endfor %}
</div>
</body>
</html>
