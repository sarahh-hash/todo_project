<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новая задача</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 16px;
            background: #f3f4f6;
            color: #333;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font: inherit;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: 2px solid #6955d9;
        }

        .field {
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #6955d9;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #5542bc;
        }

        a {
            color: #6955d9;
            text-decoration: none;
        }

        .errorlist {
            color: #c0392b;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Новая задача</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <div class="field">
            <label for="{{ form.title.id_for_label }}">
                Название задачи
            </label>
            {{ form.title }}
            {{ form.title.errors }}
        </div>

        <div class="field">
            <label for="{{ form.description.id_for_label }}">
                Описание (необязательно)
            </label>
            {{ form.description }}
            {{ form.description.errors }}
        </div>

        <div class="actions">
            <button type="submit">Создать задачу</button>
            <a href="{% url 'tasks:list' %}">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
