<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ task.title }}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 16px;
            background: #f3f4f6;
            color: #333;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #6955d9;
            text-decoration: none;
        }

        h1 {
            margin: 0 0 20px;
            overflow-wrap: anywhere;
        }

        h2 {
            margin-top: 25px;
            font-size: 18px;
        }

        .description {
            color: #555;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 8px;
            background: #fff3cd;
            color: #856404;
        }

        .completed {
            background: #d4edda;
            color: #287340;
        }

        .date {
            margin-top: 20px;
            color: #888;
            font-size: 14px;
        }

        form {
            margin-top: 25px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #6955d9;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:hover {
            background: #5542bc;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid #a493f0;
            outline-offset: 3px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <a class="back" href="{% url 'tasks:list' %}">
        ← Все задачи
    </a>

    <h1>{{ task.title }}</h1>

    <span class="status {% if task.is_completed %}completed{% endif %}">
        {% if task.is_completed %}
            ✓ Выполнено
        {% else %}
            Не выполнено
        {% endif %}
    </span>

    <h2>Описание</h2>

    <div class="description">
        {{ task.description|default:"Описание не добавлено."|linebreaksbr }}
    </div>

    <p class="date">
        Дата создания: {{ task.created_at|date:"d.m.Y H:i" }}
    </p>

    <form method="post" action="{% url 'tasks:toggle' task.pk %}">
        {% csrf_token %}
        <input type="hidden" name="return_to" value="detail">

        <button type="submit">
            {% if task.is_completed %}
                Вернуть в работу
            {% else %}
                Отметить выполненной
            {% endif %}
        </button>
    </form>
</div>
</body>
</html>
